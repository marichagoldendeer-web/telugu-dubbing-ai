name: R79 5 Minute Telugu to English Dubbing Stress Test

concurrency:
  group: r79-kaggle
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r79/**"
      - ".github/workflows/r79-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r79-5m-stress

jobs:
  r79:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 1

      - name: Install Kaggle CLI 2.2.2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade "kaggle==2.2.2"
          kaggle --version

      - name: Push R79 to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p kaggle-output
          kaggle kernels push -p kaggle/r79 2>&1 | tee kaggle-output/r79_push.log
          rc=${PIPESTATUS[0]}
          echo "push_returncode=${rc}" | tee -a kaggle-output/r79_push.log
          exit ${rc}

      - name: Resolve R79 Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          sleep 20
          ACTUAL_KERNEL=""
          for attempt in $(seq 1 10); do
            echo "R79 kernel resolve attempt ${attempt}/10"
            LIST_OUTPUT="$(kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r79 --page-size 50 2>&1 || true)"
            printf '%s\n' "$LIST_OUTPUT"
            ACTUAL_KERNEL="$(printf '%s\n' "$LIST_OUTPUT" | awk '$1 == "anjiallkumar/telugu-dubbing-ai-r79-5m-stress" {print $1; exit}')"
            if [ -n "$ACTUAL_KERNEL" ]; then
              break
            fi
            sleep 20
          done
          test -n "$ACTUAL_KERNEL" || {
            echo "R79_ERROR=Exact Kaggle kernel slug not found"
            exit 1
          }
          echo "KAGGLE_KERNEL=$ACTUAL_KERNEL" >> "$GITHUB_ENV"
          echo "R79_KAGGLE_KERNEL_RESOLVED=$ACTUAL_KERNEL"

      - name: Stream R79 kernel logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          rm -f kaggle-output/r79_kaggle_logs.txt
          sleep 45
          timeout 3000 kaggle kernels logs "$KAGGLE_KERNEL" --follow --interval 10 2>&1 | tee kaggle-output/r79_kaggle_logs.txt
          rc=${PIPESTATUS[0]}
          echo "logs_follow_rc=$rc" | tee -a kaggle-output/r79_kaggle_logs.txt
          if grep -q "R79 DIAGNOSTIC COMPLETE" kaggle-output/r79_kaggle_logs.txt; then exit 0; fi
          if grep -q "R79 DIAGNOSTIC FAILED" kaggle-output/r79_kaggle_logs.txt; then exit 1; fi
          sleep 120
          kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 | tee -a kaggle-output/r79_kaggle_logs.txt
          if grep -q "R79 DIAGNOSTIC COMPLETE" kaggle-output/r79_kaggle_logs.txt; then exit 0; fi
          if grep -q "R79 DIAGNOSTIC FAILED" kaggle-output/r79_kaggle_logs.txt; then exit 1; fi
          exit 1

      - name: Upload R79 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r79-diagnostics
          path: |
            kaggle-output/r79_kaggle_logs.txt
            kaggle-output/r79_push.log
          if-no-files-found: warn

      - name: Download R79 generated outputs
        if: success()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output
          find kaggle-output -maxdepth 4 -type f -print
        continue-on-error: true

      - name: Upload R79 generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r79-generated-outputs
          path: |
            kaggle-output/**/*.mp4
            kaggle-output/**/*.wav
            kaggle-output/**/*.json
            kaggle-output/**/*.txt
          if-no-files-found: warn
