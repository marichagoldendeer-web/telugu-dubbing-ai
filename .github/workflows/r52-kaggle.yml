name: R52 Kaggle Telugu STT Translation

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r52/**"
      - "kaggle/r52/kernel-metadata.json"
      - ".github/workflows/r52-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r52
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r52:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          echo "KAGGLE_API_TOKEN is available."

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle

      - name: Verify R52 ASR dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets files "$ASR_DATASET"

      - name: Verify R52 source video dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking source video dataset: $VIDEO_DATASET"
          status=$(kaggle datasets status "$VIDEO_DATASET")
          echo "$status"
          echo "$status" | grep -qi "ready" || {
            echo "R52 source video dataset is not READY."
            exit 1
          }
          kaggle datasets files "$VIDEO_DATASET"

      - name: Save R52 kernel metadata and sources
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Saving R52 kernel version without running it first."
          kaggle kernels push -p kaggle/r52 --no-run

      - name: Push R52 kernel to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Running the saved R52 version with its attached datasets."
          kaggle kernels push -p kaggle/r52

      - name: Wait for Kaggle R52
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "[$attempt/80] $status"

            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "Kaggle R52 completed."
              exit 0
            fi

            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|FAILED|CANCELLED|CANCELED|INVALID)"; then
              echo "Kaggle R52 entered a failure state."
              exit 0
            fi

            sleep 15
          done

          echo "Kaggle R52 did not reach a terminal state within the wait window."

      - name: Download R52 result
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(automation_result\.txt|.*\.txt|.*\.json)$' || true

          echo "Downloaded result files:"
          find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true

          if test -f kaggle-output/automation_result.txt; then
            cat kaggle-output/automation_result.txt
          fi

      - name: Upload R52 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r52-result
          path: kaggle-output/
          if-no-files-found: warn

      - name: Fail when R52 reports an error
        if: always()
        run: |
          if test -s kaggle-output/automation_result.txt && grep -q "R52 CHECKPOINT FAILED" kaggle-output/automation_result.txt; then
            echo "R52 failed inside Kaggle."
            exit 1
          fi
