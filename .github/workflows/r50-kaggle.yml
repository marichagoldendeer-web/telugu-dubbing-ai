name: R50 Kaggle Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Actions secrets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          test -n "${KAGGLE_API_TOKEN:-}"
          test -n "${HF_TOKEN:-}"
          echo "✅ GitHub Actions job started."
          echo "✅ KAGGLE_API_TOKEN is available."
          echo "✅ HF_TOKEN is available."
