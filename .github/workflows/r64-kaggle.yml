name: R64 English TTS Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r64/**"
      - ".github/workflows/r64-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r64-tts-diagnostic

jobs:
  r64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 1

      - name: Install Kaggle CLI 2.2.2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade "kaggle==2.2.2"
          kaggle --version

      - name: Verify target kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r64 --page-size 20

      - name: Push R64 to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r64

      - name: Resolve actual Kaggle kernel slug
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          sleep 15
          LIST_OUTPUT="$(kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r64 --page-size 20)"
          printf '%s\n' "$LIST_OUTPUT"
          ACTUAL_KERNEL="$(printf '%s\n' "$LIST_OUTPUT" | awk '$1 == "anjiallkumar/telugu-dubbing-ai-r64-tts-diagnostic" {print $1; exit}')"
          test -n "$ACTUAL_KERNEL" || {
            echo "ERROR: R64 Kaggle kernel slug not found."
            exit 1
          }
          echo "Resolved Kaggle kernel: $ACTUAL_KERNEL"
          echo "KAGGLE_KERNEL=$ACTUAL_KERNEL" >> "$GITHUB_ENV"

      - name: Stream R64 kernel logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          rm -f kaggle-output/r64_kaggle_logs.txt
          echo "Using Kaggle kernel: $KAGGLE_KERNEL" | tee -a kaggle-output/r64_kaggle_logs.txt
          sleep 45
          timeout 900 kaggle kernels logs "$KAGGLE_KERNEL" --follow --interval 10 2>&1 | tee -a kaggle-output/r64_kaggle_logs.txt
          rc=${PIPESTATUS[0]}
          echo "logs_follow_rc=$rc" | tee -a kaggle-output/r64_kaggle_logs.txt

          if grep -q "R64 DIAGNOSTIC COMPLETE" kaggle-output/r64_kaggle_logs.txt; then
            exit 0
          fi

          if grep -q "R64 DIAGNOSTIC FAILED" kaggle-output/r64_kaggle_logs.txt; then
            exit 1
          fi

          sleep 90
          kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 | tee -a kaggle-output/r64_kaggle_logs.txt

          if grep -q "R64 DIAGNOSTIC COMPLETE" kaggle-output/r64_kaggle_logs.txt; then
            exit 0
          fi

          if grep -q "R64 DIAGNOSTIC FAILED" kaggle-output/r64_kaggle_logs.txt; then
            exit 1
          fi

          exit 1

      - name: Upload R64 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r64-kaggle-logs
          path: kaggle-output/r64_kaggle_logs.txt
          if-no-files-found: warn

      - name: Download R64 generated audio
        if: success()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output
          find kaggle-output -maxdepth 3 -type f -print
        continue-on-error: true

      - name: Upload R64 audio output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r64-english-tts-output
          path: |
            kaggle-output/**/*.mp3
            kaggle-output/**/*.wav
          if-no-files-found: warn
