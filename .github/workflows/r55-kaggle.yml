name: R55 Kaggle Full Telugu STT Translation

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r55/**"
      - ".github/workflows/r55-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r55
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r55:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Verify source datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"

      - name: Push R55 once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r55

      - name: Wait for R55 and require true success
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 160); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "[$attempt/160] $status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "R55 Kaggle kernel completed."
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|FAILED|CANCELLED|CANCELED|INVALID)"; then
              echo "R55 Kaggle kernel failed."
              exit 1
            fi
            sleep 15
          done
          echo "R55 timed out waiting for Kaggle."
          exit 1

      - name: Download R55 results with retry
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          for attempt in $(seq 1 6); do
            echo "Output download attempt $attempt/6"
            kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(automation_result\.txt|r55_.*\.txt|r55_result\.json)$' && break
            sleep 20
          done
          find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          for f in kaggle-output/automation_result.txt kaggle-output/r55_telugu_transcript.txt kaggle-output/r55_english_translation.txt kaggle-output/r55_result.json; do
            if test -f "$f"; then
              echo "----- $f -----"
              cat "$f"
            fi
          done

      - name: Upload R55 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r55-result
          path: kaggle-output/
          if-no-files-found: warn

      - name: Fail on R55 checkpoint failure
        if: always()
        run: |
          if test -s kaggle-output/automation_result.txt && grep -q "R55 CHECKPOINT FAILED" kaggle-output/automation_result.txt; then
            echo "R55 checkpoint failed."
            exit 1
          fi
