name: R53 Kaggle Dataset Mount Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r53/**"
      - ".github/workflows/r53-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r53
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r53:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          echo "KAGGLE_API_TOKEN is available."

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Verify source datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"
          kaggle datasets files "$TRANSLATION_DATASET"

      - name: Push R53 once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r53
          echo "R53 pushed once; no duplicate push."

      - name: Wait for R53
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "[$attempt/80] $status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then exit 0; fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|FAILED|CANCELLED|CANCELED|INVALID)"; then exit 0; fi
            sleep 15
          done
          echo "R53 did not reach a terminal state within the wait window."

      - name: Download R53 result
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(automation_result\\.txt|.*\\.txt|.*\\.json)$' || true
          find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\\n' || true
          test ! -f kaggle-output/automation_result.txt || cat kaggle-output/automation_result.txt

      - name: Upload R53 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r53-result
          path: kaggle-output/
          if-no-files-found: warn

      - name: Fail when R53 reports an error
        if: always()
        run: |
          if test -s kaggle-output/automation_result.txt && grep -q "R53 CHECKPOINT FAILED" kaggle-output/automation_result.txt; then
            echo "R53 failed inside Kaggle."
            exit 1
          fi
