name: R59 Kaggle Diagnostic - Robust Status

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r59/**"
      - ".github/workflows/r59-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r59
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r59:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 1

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version
          kaggle kernels status --help | head -30 || true

      - name: Verify source datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"

      - name: Push R59 once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r59

      - name: Verify R59 is discoverable
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          for i in 1 2 3 4 5; do
            echo "Discovery attempt $i"
            kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r59 --page-size 20 || true
            sleep 10
          done

      - name: Wait by output availability instead of kernels.get
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          rm -rf kaggle-output
          mkdir -p kaggle-output
          for attempt in $(seq 1 90); do
            echo "===== OUTPUT POLL [$attempt/90] ====="
            kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(r59_diagnostic.txt|r59_asr_smoke.txt|r59_pip_report.json)$'
            rc=$?
            find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null
            if test -s kaggle-output/r59_diagnostic.txt; then
              echo "R59 diagnostic received."
              exit 0
            fi
            sleep 20
          done
          echo "R59 output did not become available within the polling window."
          exit 1

      - name: Print diagnostic
        if: always()
        run: |
          if test -f kaggle-output/r59_diagnostic.txt; then
            cat kaggle-output/r59_diagnostic.txt
          fi

      - name: Upload R59 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r59-diagnostic
          path: kaggle-output/
          if-no-files-found: warn
