name: R57 Controlled NeMo Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r57/**"
      - ".github/workflows/r57-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r57
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r57:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Verify source datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"

      - name: Push R57 once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r57

      - name: Wait for R57 completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 160); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "[$attempt/160] $status"
            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "R57 Kaggle kernel completed."
              exit 0
            fi
            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|FAILED|CANCELLED|CANCELED|INVALID)"; then
              echo "R57 Kaggle kernel entered a terminal failure state."
              exit 1
            fi
            sleep 15
          done
          echo "R57 timed out."
          exit 1

      - name: Download diagnostic
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          for delay in 20 40 80 120; do
            echo "Waiting ${delay}s before output download..."
            sleep "$delay"
            kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(r57_diagnostic.txt|r57_asr_smoke.txt|r57_pip_report.json)$' && break
          done
          find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          if test -f kaggle-output/r57_diagnostic.txt; then
            cat kaggle-output/r57_diagnostic.txt
          fi

      - name: Upload R57 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r57-diagnostic
          path: kaggle-output/
          if-no-files-found: warn
