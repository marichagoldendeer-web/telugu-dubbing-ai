name: R63 Kaggle STT + IndicTrans2 Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r63/**"
      - ".github/workflows/r63-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r63-diagnostic
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r63:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 1

      - name: Install Kaggle CLI 2.2.2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade "kaggle==2.2.2"
          kaggle --version

      - name: Verify datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"

      - name: Push R63
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r63

      - name: Resolve actual Kaggle kernel slug
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          sleep 15
          LIST_OUTPUT="$(kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r63 --page-size 20)"
          printf '%s\n' "$LIST_OUTPUT"
          ACTUAL_KERNEL="$(printf '%s\n' "$LIST_OUTPUT" | awk '$1 == "anjiallkumar/telugu-dubbing-ai-r63-diagnostic" {print $1; exit}')"
          test -n "$ACTUAL_KERNEL" || {
            echo "ERROR: R63 Kaggle kernel slug not found."
            exit 1
          }
          echo "Resolved Kaggle kernel: $ACTUAL_KERNEL"
          echo "KAGGLE_KERNEL=$ACTUAL_KERNEL" >> "$GITHUB_ENV"

      - name: Stream R63 kernel logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          rm -f kaggle-output/r63_kaggle_logs.txt
          echo "Using Kaggle kernel: $KAGGLE_KERNEL" | tee -a kaggle-output/r63_kaggle_logs.txt
          sleep 30
          timeout 1500 kaggle kernels logs "$KAGGLE_KERNEL" --follow --interval 10 2>&1 | tee -a kaggle-output/r63_kaggle_logs.txt
          rc=${PIPESTATUS[0]}
          echo "logs_follow_rc=$rc" | tee -a kaggle-output/r63_kaggle_logs.txt
          if grep -q "R63 DIAGNOSTIC COMPLETE\|R63 DIAGNOSTIC FAILED\|R63 CHECKPOINT" kaggle-output/r63_kaggle_logs.txt; then
            exit 0
          fi
          sleep 120
          kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 | tee -a kaggle-output/r63_kaggle_logs.txt
          if grep -q "R63 DIAGNOSTIC COMPLETE\|R63 DIAGNOSTIC FAILED\|R63 CHECKPOINT" kaggle-output/r63_kaggle_logs.txt; then
            exit 0
          fi
          exit 1

      - name: Upload R63 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-kaggle-logs
          path: kaggle-output/r63_kaggle_logs.txt
          if-no-files-found: warn
