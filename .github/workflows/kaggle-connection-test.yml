name: Kaggle Connection Test

on:
  workflow_dispatch:

jobs:
  test-kaggle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Testing Kaggle authentication..."
          kaggle kernels list --mine --page-size 5

      - name: Connection test complete
        run: |
          echo "✅ GitHub Actions → Kaggle authentication succeeded"
