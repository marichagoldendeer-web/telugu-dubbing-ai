name: R65 Integrated Telugu to English TTS

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r65/**"
      - ".github/workflows/r65-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r65-integrated-tts

jobs:
  r65:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 1

      - name: Install Kaggle CLI 2.2.2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade "kaggle==2.2.2"
          kaggle --version

      - name: Verify target kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r65 --page-size 20

      - name: Push R65 to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p kaggle-output
          echo "=== R65 KAGGLE PUSH ===" | tee kaggle-output/r65_push.log
          cat kaggle/r65/kernel-metadata.json | tee -a kaggle-output/r65_push.log
          echo "Kaggle CLI:" | tee -a kaggle-output/r65_push.log
          kaggle --version 2>&1 | tee -a kaggle-output/r65_push.log
          echo "Pushing R65 kernel..." | tee -a kaggle-output/r65_push.log
          kaggle kernels push -p kaggle/r65 2>&1 | tee -a kaggle-output/r65_push.log
          rc=${PIPESTATUS[0]}
          echo "push_returncode=${rc}" | tee -a kaggle-output/r65_push.log
          exit ${rc}

      - name: Resolve actual Kaggle kernel slug
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          sleep 15
          LIST_OUTPUT="$(kaggle kernels list --user anjiallkumar --search telugu-dubbing-ai-r65 --page-size 20)"
          printf '%s\n' "$LIST_OUTPUT"
          ACTUAL_KERNEL="$(printf '%s\n' "$LIST_OUTPUT" | awk '$1 == "anjiallkumar/telugu-dubbing-ai-r65-integrated-tts" {print $1; exit}')"
          test -n "$ACTUAL_KERNEL" || {
            echo "ERROR: R65 Kaggle kernel slug not found."
            exit 1
          }
          echo "Resolved Kaggle kernel: $ACTUAL_KERNEL"
          echo "KAGGLE_KERNEL=$ACTUAL_KERNEL" >> "$GITHUB_ENV"

      - name: Stream R65 kernel logs
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          mkdir -p kaggle-output
          rm -f kaggle-output/r65_kaggle_logs.txt
          echo "Using Kaggle kernel: $KAGGLE_KERNEL" | tee -a kaggle-output/r65_kaggle_logs.txt
          sleep 45
          timeout 1500 kaggle kernels logs "$KAGGLE_KERNEL" --follow --interval 10 2>&1 | tee -a kaggle-output/r65_kaggle_logs.txt
          rc=${PIPESTATUS[0]}
          echo "logs_follow_rc=$rc" | tee -a kaggle-output/r65_kaggle_logs.txt

          if grep -q "R65 DIAGNOSTIC COMPLETE" kaggle-output/r65_kaggle_logs.txt; then
            exit 0
          fi

          if grep -q "R65 DIAGNOSTIC FAILED" kaggle-output/r65_kaggle_logs.txt; then
            exit 1
          fi

          sleep 120
          kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 | tee -a kaggle-output/r65_kaggle_logs.txt

          if grep -q "R65 DIAGNOSTIC COMPLETE" kaggle-output/r65_kaggle_logs.txt; then
            exit 0
          fi

          if grep -q "R65 DIAGNOSTIC FAILED" kaggle-output/r65_kaggle_logs.txt; then
            exit 1
          fi

          exit 1

      - name: Upload R65 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r65-diagnostics
          path: |
            kaggle-output/r65_kaggle_logs.txt
            kaggle-output/r65_push.log
          if-no-files-found: warn

      - name: Download R65 generated outputs
        if: success()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output
          find kaggle-output -maxdepth 3 -type f -print
        continue-on-error: true

      - name: Upload R65 generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r65-generated-outputs
          path: |
            kaggle-output/**/*.mp3
            kaggle-output/**/*.wav
            kaggle-output/**/*.txt
          if-no-files-found: warn
