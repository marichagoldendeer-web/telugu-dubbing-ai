name: R54 Kaggle Telugu STT Translation

on:
  push:
    branches: [main]
    paths:
      - "kaggle/r54/**"
      - ".github/workflows/r54-kaggle.yml"
  workflow_dispatch:

env:
  KAGGLE_KERNEL: anjiallkumar/telugu-dubbing-ai-r54
  ASR_DATASET: anjiallkumar/indicconformer-te-hybrid-rnnt-large
  TRANSLATION_DATASET: anjiallkumar/indictrans2-indic-en-dist-200m
  VIDEO_DATASET: anjiallkumar/r52-telugu-source-video

jobs:
  r54:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kaggle secret
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          echo "KAGGLE_API_TOKEN is available."

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Verify source datasets
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets status "$ASR_DATASET"
          kaggle datasets status "$TRANSLATION_DATASET"
          kaggle datasets status "$VIDEO_DATASET"
          kaggle datasets files "$TRANSLATION_DATASET"

      - name: Push R54 once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle/r54
          echo "R54 pushed once."

      - name: Wait for R54
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "[$attempt/120] $status"

            if echo "$status" | grep -q "KernelWorkerStatus.COMPLETE"; then
              echo "R54 Kaggle kernel completed."
              exit 0
            fi

            if echo "$status" | grep -Eq "KernelWorkerStatus.(ERROR|FAILED|CANCELLED|CANCELED|INVALID)"; then
              echo "R54 Kaggle kernel entered a terminal failure state."
              exit 0
            fi

            sleep 15
          done

          echo "R54 did not reach a terminal state within the wait window."

      - name: Download R54 results
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle-output -o --file-pattern '^(automation_result\.txt|r54_.*\.txt|r54_result\.json)$' || true
          echo "Downloaded R54 result files:"
          find kaggle-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          for f in kaggle-output/automation_result.txt kaggle-output/r54_telugu_transcript.txt kaggle-output/r54_english_translation.txt kaggle-output/r54_result.json; do
            if test -f "$f"; then
              echo "----- $f -----"
              cat "$f"
            fi
          done

      - name: Upload R54 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r54-result
          path: kaggle-output/
          if-no-files-found: warn

      - name: Fail when R54 reports an error
        if: always()
        run: |
          if test -s kaggle-output/automation_result.txt && grep -q "R54 CHECKPOINT FAILED" kaggle-output/automation_result.txt; then
            echo "R54 failed inside Kaggle."
            exit 1
          fi
